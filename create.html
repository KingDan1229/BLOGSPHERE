</head>
<body>
    
    <div class="page">
        <header class="topbar">
           <a href="./index.html" class="brand">Blog<span>Sphere</span></a>
            <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">
                <span></span>
            </button>
            <!-- <div class="search-wrap">
                <input class="search-input" type="search" placeholder="Search stories, people, topics">
            </div> -->
            <nav class="topnav" id="mainNav">
                <a href="./index.html">Home</a>
                <a href="./categories.html" >Categories</a>
                <a href="./create.html" class="active">Create Post</a>
                <!-- <a href="./signup.html">Login/Signup</a> -->
                <a href="./profile.html">
                    <div class="profile-wrap" id="profileWrap">
                        <div class="profile-avatar" id="profileAvatar">??</div>
                        <!-- <div class="profile-dropdown" id="profileDropdown">
                            <div class="pd-name" id="pdName">—</div>
                            <div class="pd-meta" id="pdMeta">—</div>
                            <button id="logoutBtn"><i data-lucide="log-out" style="width:14px;height:14px;vertical-align:middle;margin-right:6px;"></i>Log Out</button>
                        </div> -->

                </a>
            </nav>
        </header>





    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">



                    <!-- Form Card -->
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Create New Post</h5>
                        </div>
                        <div class="card-body p-4">

                            <form id="createPostForm">

                                <!-- Title -->
                                <div class="mb-3">
                                    <label for="postTitle" class="form-label fw-bold">Title</label>
                                    <input type="text" class="form-control" id="postTitle" 
                                           placeholder="Enter post title" required />
                                </div>

                                <!-- Category -->
                                <div class="mb-3">
                                    <label for="postCategory" class="form-label fw-bold">Category</label>
                                    <select class="form-select" id="postCategory" required>
                                        <option value="">Select a category</option>
                                        <option value="Technology">💻 Technology</option>
                                        <option value="Lifestyle">🌿 Lifestyle</option>
                                        <option value="Travel">✈️ Travel</option>
                                        <option value="Food">🍕 Food</option>
                                        <option value="Health">🏥 Health</option>
                                        <option value="Business">💼 Business</option>
                                    </select>
                                </div>

                                <!-- Content -->
                                <div class="mb-3">
                                    <label for="postContent" class="form-label fw-bold">Content</label>
                                    <textarea class="form-control" id="postContent" rows="8" 
                                              placeholder="Write your post content here..." required></textarea>
                                </div>

                                <!-- Buttons -->
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-send"></i> Publish
                                    </button>
                                    <button type="reset" class="btn btn-outline-secondary">
                                        <i class="bi bi-eraser"></i> Clear
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>




    
        <footer class="footer minimal">
          <div class="footer-inner">

</body>
