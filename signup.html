<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOGSPHERE</title>
    <link rel="stylesheet" href="./Stylesheet/signup.css">
</head>
<body>




<div class="all">
    <div class="hero">
        <form>
            <h2>Sign<span>Up</span></h2>
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName">
                <small class="red hide" id="checkFullName" aria-live="polite">Please enter your full name</small>
            </div>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
                <small class="red hide" id="checkUsername" aria-live="polite">Please enter your username</small>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <small class="red hide" id="checkEmail" aria-live="polite">Please enter your email</small>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
                <small class="red hide" id="checkPassword" aria-live="polite">Please enter your password</small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <small class="red hide" id="checkConfirmPassword" aria-live="polite">Please confirm your password</small>
            </div>
            <button type="submit" class="cr7">SignUp</button>
            <p>Already have an account? <a href="./login.html">Login</a></p>
        </form>
    </div>
</div>


  <script src="./JS/signup.js"></script>
</body>
</html>
