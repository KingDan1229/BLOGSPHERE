<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogSphere | Profile</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./Stylesheet/font-awesome.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./Stylesheet/profile.css" />
</head>
<body>

    <div class="page">

   
        <header class="topbar">
            <a href="./index.html" class="brand">Blog<span>Sphere</span></a>
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span>
            </button>
            <nav class="topnav" id="mainNav">
                <a href="./index.html">Home</a>
                <a href="./categories.html">Categories</a>
                <a href="./create.html">Create Post</a>
                <!-- <a href="./signup.html">Login/Signup</a> -->
                <a href="./profile.html" class="active">
                    <div class="profile-wrap" id="profileWrap">
                        <div class="profile-avatar" id="profileAvatar">??</div>
                        <div class="profile-dropdown" id="profileDropdown">
                            <div class="pd-name" id="pdName">—</div>
                            <div class="pd-meta" id="pdMeta">—</div>
                            <button id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Log Out</button>
                        </div>
                    </div>
                </a>
            </nav>
        </header>

        <section class="profile-header">
            <div class="container">
                <div class="profile-header-content">

                    <!-- Large Avatar (Initials) -->
                    <div class="profile-avatar-large" id="profileAvatarLarge">
                        <span id="profileInitials">U</span>
                    </div>

                    <!-- User Info -->
                    <div class="profile-user-info">
                        <h2 id="profileName">Username</h2>
                        <p id="profileEmail">user@email.com</p>
                        <div class="profile-stats">
                            <span id="profilePostCount">0 Posts</span>
                            <span id="profileLikesCount">0 Likes</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="profile-actions">
                        <a href="./create.html" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Create Post
                        </a>
                        <button id="logoutBtnLarge" class="btn btn-outline-danger">
                            <i class="bi bi-box-arrow-right"></i> Log Out
                        </button>
                    </div>

                </div>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- USER'S POSTS SECTION -->
        <!-- ============================================================ -->
        <section class="profile-posts-section">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">📚 Your Posts</h4>
                </div>
                <div id="userPosts" class="row g-4">
                    <!-- Posts rendered by JavaScript -->
                </div>
            </div>
        </section>

     
        <footer class="footer">
            <div class="footer-inner">
                <p class="footer-copy">© 2026 BlogSphere. All rights reserved.</p>
            </div>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./BOOTSTRAP 4/bootstrap tools/jquery-3.2.1.min.js"></script>
    <script src="./BOOTSTRAP 4/bootstrap tools/bootstrap.js"></script>
    <script src="./JS/api.js"></script>
    <script src="./JS/profile.js"></script>

</body>
</html>
