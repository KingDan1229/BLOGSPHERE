<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogSphere | Edit Post</title>

    <link rel="stylesheet" href="./Stylesheet/font-awesome.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./Stylesheet/edit.css" />
</head>
<body>

    <div class="page">

        <!-- ============================================================ -->
        <!-- NAVBAR -->
        <!-- ============================================================ -->
        <header class="topbar">
            <a href="./index.html" class="brand">Blog<span>Sphere</span></a>
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span>
            </button>
            <nav class="topnav" id="mainNav">
                <a href="./index.html">Home</a>
                <a href="./categories.html">Categories</a>
                <a href="./create.html">Create Post</a>
                <!-- <a href="./signup.html">Login/Signup</a> -->
                <a href="./profile.html" class="active">
                    <div class="profile-wrap" id="profileWrap">
                        <div class="profile-avatar" id="profileAvatar">??</div>
                        <div class="profile-dropdown" id="profileDropdown">
                            <div class="pd-name" id="pdName">—</div>
                            <div class="pd-meta" id="pdMeta">—</div>
                            <button id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Log Out</button>
                        </div>
                    </div>
                </a>
            </nav>
        </header>

        <!-- ============================================================ -->
        <!-- EDIT POST FORM -->
        <!-- ============================================================ -->
        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <!-- Back Link -->
                        <a href="./profile.html" class="back-link">
                            <i class="bi bi-arrow-left"></i> Back to Profile
                        </a>

                        <!-- Form Card -->
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-warning text-dark">
                                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Post</h5>
                            </div>
                            <div class="card-body p-4">

                                <form id="editPostForm">

                                    <!-- Post ID (hidden) -->
                                    <input type="hidden" id="editPostId" />

                                    <!-- Title -->
                                    <div class="mb-3">
                                        <label for="editTitle" class="form-label fw-bold">Title</label>
                                        <input type="text" class="form-control" id="editTitle" 
                                               placeholder="Enter post title" required />
                                    </div>

                                    <!-- Category -->
                                    <div class="mb-3">
                                        <label for="editCategory" class="form-label fw-bold">Category</label>
                                        <select class="form-select" id="editCategory" required>
                                            <option value="Technology">💻 Technology</option>
                                            <option value="Lifestyle">🌿 Lifestyle</option>
                                            <option value="Travel">✈️ Travel</option>
                                            <option value="Food">🍕 Food</option>
                                            <option value="Health">🏥 Health</option>
                                            <option value="Business">💼 Business</option>
                                        </select>
                                    </div>

                                    <!-- Content -->
                                    <div class="mb-3">
                                        <label for="editContent" class="form-label fw-bold">Content</label>
                                        <textarea class="form-control" id="editContent" rows="8" 
                                                  placeholder="Write your post content here..." required></textarea>
                                    </div>

                                    <!-- Buttons -->
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-warning">
                                            <i class="bi bi-pencil"></i> Update Post
                                        </button>
                                        <a href="./profile.html" class="btn btn-outline-secondary">
                                            <i class="bi bi-x-circle"></i> Cancel
                                        </a>
                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- FOOTER -->
        <!-- ============================================================ -->
        <footer class="footer">
            <div class="footer-inner">
                <p class="footer-copy">© 2026 BlogSphere. All rights reserved.</p>
            </div>
        </footer>

    </div>


 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./JS/api.js"></script>
    <script src="./JS/edit.js"></script>

</body>
</html>
